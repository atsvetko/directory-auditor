# Expected outcome of `dirauditor scan` against the Windows AD lab built by
# tools/lab/windows/provision.ps1 + populate.ps1 (domain da.test).
# Checked by `go run ./tools/lab/verify`. Conservative on purpose: only the
# deterministic single-object fixtures are pinned under `must`; every other
# directory-core check may fire (`allow`). Tighten by promoting checks from
# allow to must once the first live run shows their exact DNs.
lab: windows
min_objects: 40
dn_glob: true
allow_skip: [provider, tier]   # FreeIPA/Samba entries skip by provider; tier-2 by tier
must:
  DSA-0001: ["CN=svc_legacy,CN=Users,DC=da,DC=test"]   # no Kerberos pre-auth
  DSA-0011: ["CN=rev_user,CN=Users,DC=da,DC=test"]   # reversible encryption
  DSA-0026: ["CN=svc_sql,CN=Users,DC=da,DC=test"]   # kerberoastable (SPN on a user)
  DSA-0027: ["CN=DnsAdmins,CN=Users,DC=da,DC=test"]   # DnsAdmins has a member
  DSA-0028: ["CN=t_contractor,CN=Users,DC=da,DC=test"]   # cleartext password in description (masked in the report)
  DSA-0042: ["CN=Guest,CN=Users,DC=da,DC=test"]   # built-in Guest enabled
  DSA-0071: ["CN=WeakAdminPSO,CN=Password Settings Container,CN=System,DC=da,DC=test"]   # weak PSO applied to Domain Admins
allow:
  - DSA-0002
  - DSA-0003
  - DSA-0004
  - DSA-0005
  - DSA-0006
  - DSA-0007
  - DSA-0008
  - DSA-0009
  - DSA-0010
  - DSA-0012
  - DSA-0013
  - DSA-0014
