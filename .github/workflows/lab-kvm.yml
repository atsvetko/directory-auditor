# Live labs on the self-hosted KVM host (tools/lab/kvm): the Samba AD DC VM and
# the Windows Server 2025 AD DC VM, each reset to its baseline snapshot, scanned
# as the ordinary 'audit' user, verified against testdata/lab/*-expect.yaml,
# and checked from the DC side for writes.
#
# The runner (labels self-hosted, linux, kvm-lab) is the maintainer's machine:
# jobs run only for this repository's own branches, never for pull requests
# from forks (and fork workflows also need approval in the repo settings).
name: lab-kvm

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  schedule:
    - cron: "40 1 * * *"        # nightly, 01:40 UTC
  workflow_dispatch:

permissions:
  contents: read

# One lab job at a time on the host; never cancel a running one (it would
# leave a VM away from its baseline until the next reset).
concurrency:
  group: kvm-lab
  cancel-in-progress: false

env:
  DIRAUDITOR_LAB: "1"

jobs:
  samba:
    name: Samba AD DC (KVM)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, kvm-lab]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: reset to baseline
        run: tools/lab/kvm/samba-lab.sh reset
      - name: scan, verify, DC-side read-only check
        run: tools/lab/kvm/samba-lab.sh scan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-samba-report
          path: |
            ~/.local/share/da-lab/state/out/lab-out/report.html
            ~/.local/share/da-lab/state/out/lab-out/report.json
            ~/.local/share/da-lab/state/out/lab-out/run-*.log
          retention-days: 14
      # off between runs: the next job's reset brings it back from the snapshot
      - name: power the VM off
        if: always()
        run: tools/lab/kvm/samba-lab.sh stop || true

  windows:
    name: Windows Server 2025 DC (KVM)
    # after the Samba lane (one VM workload at a time on the host), whatever its result
    needs: samba
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, kvm-lab]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: baseline (forest da.test, weak objects) — scan, verify, DC-side write check
        run: |
          tools/lab/kvm/windows-lab.sh reset baseline
          tools/lab/kvm/windows-lab.sh scan
          mkdir -p reports/baseline && cp -r ~/.local/share/da-lab/state/out-windows/lab-out/. reports/baseline/
      - name: adcs (Enterprise CA + weak templates) — scan, verify, DC-side write check
        if: ${{ !cancelled() }}
        run: |
          tools/lab/kvm/windows-lab.sh reset adcs
          tools/lab/kvm/windows-lab.sh scan
          mkdir -p reports/adcs && cp -r ~/.local/share/da-lab/state/out-windows/lab-out/. reports/adcs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-windows-reports
          path: |
            reports/*/report.html
            reports/*/report.json
            reports/*/run-*.log
          retention-days: 14
      - name: power the VM off
        if: always()
        run: tools/lab/kvm/windows-lab.sh stop || true
