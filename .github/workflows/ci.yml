name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOFLAGS: -trimpath

jobs:
  verify:
    name: fmt · vet · test · vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: gofmt
        run: |
          out="$(gofmt -l .)"; if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          CGO_ENABLED: "1"   # the race detector needs cgo; release builds stay CGO_ENABLED=0
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build (reproducible flags)
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-buildid= -X github.com/atsvetko/directory-auditor/internal/buildinfo.Version=${GITHUB_REF_NAME} -X github.com/atsvetko/directory-auditor/internal/buildinfo.Commit=${GITHUB_SHA::12} -X github.com/atsvetko/directory-auditor/internal/buildinfo.Date=$(date -u +%Y-%m-%d)" \
            -o "dist/dirauditor-${GOOS}-${GOARCH}${ext}" ./cmd/dirauditor
          sha256sum dist/* | tee dist/SHA256SUMS
      - name: read-only symbol gate (review-pack artefact 11)
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          scripts/readonly-check.sh "dist/dirauditor-${GOOS}-${GOARCH}${ext}"
      - name: smoke test (native target only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/dirauditor-linux-amd64 version
          ./dist/dirauditor-linux-amd64 manifest
          ./dist/dirauditor-linux-amd64 analyse --snapshot testdata/synthetic-lab.json.zst --packs testdata/packs --allow-unsigned --out out
          test -s out/report.html && test -s out/report.json
          # prototype layout: binary alone, no packs directory → built-in preview checks
          mkdir -p proto && cp dist/dirauditor-linux-amd64 proto/dirauditor && cd proto
          ./dirauditor analyse --snapshot ../testdata/synthetic-lab.json.zst --out out
          python3 -c "import json; r=json.load(open('out/report.json')); assert r['preview_checks']==68 and not r['unsigned_packs'], r['preview_checks']"
          grep -q 'Preview checks' out/report.html
          ! ./dirauditor analyse --snapshot ../testdata/synthetic-lab.json.zst --out out2 --no-preview
      - uses: actions/upload-artifact@v4
        with:
          name: dirauditor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 14

  windows:
    # The real windows/amd64 binary, run on Windows: tests, CLI, the wizard over
    # its API and the SSPI error path. Cross-compiled builds above never execute.
    name: windows smoke (native)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test (windows)
        run: go test -count=1 ./...
      - name: build
        run: go build -trimpath -o dirauditor.exe ./cmd/dirauditor
      - name: cli
        shell: pwsh
        run: |
          # exit codes are checked by hand: expected failures must not throw
          $ErrorActionPreference = "Continue"; $PSNativeCommandUseErrorActionPreference = $false
          .\dirauditor.exe version
          .\dirauditor.exe manifest | Select-String -Pattern "Preview checks built in" | Out-String | Write-Host
          .\dirauditor.exe analyse --snapshot testdata\synthetic-lab.json.zst --out out
          if ($LASTEXITCODE -ne 0) { throw "analyse failed" }
          $r = Get-Content out\report.json -Raw | ConvertFrom-Json
          if ($r.preview_checks -ne 68) { throw "preview_checks = $($r.preview_checks)" }
          if (-not (Test-Path out\report.html)) { throw "no report.html" }
          $log = Get-ChildItem out\run-*.log | Select-Object -First 1
          if (-not (Select-String -Path $log -Pattern "finished: exit 0")) { throw "run log incomplete" }
          # error paths must end in a message, not a panic
          .\dirauditor.exe doctor --server nonexistent.invalid 2>&1 | Tee-Object -Variable d | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "doctor should fail" }
          if (-not ($d -join "`n" | Select-String -Pattern "cause:")) { throw "doctor gave no cause: $d" }
          .\dirauditor.exe scan --server nonexistent.invalid --out scan-out 2>&1 | Tee-Object -Variable sc | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "scan should fail" }
          if ($sc -join "`n" | Select-String -Pattern "panic|goroutine") { throw "scan panicked: $sc" }
          Write-Host "scan error path:" ($sc -join "`n")
          exit 0   # the last native command failed on purpose; pwsh would otherwise return its exit code
      - name: wizard over its API
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $false
          $p = Start-Process -FilePath .\dirauditor.exe -ArgumentList "ui","--no-browser","--out","wiz-out" -RedirectStandardError ui.err -RedirectStandardOutput ui.out -PassThru
          $url = $null
          for ($i = 0; $i -lt 50 -and -not $url; $i++) {
            Start-Sleep -Milliseconds 200
            $txt = (Get-Content ui.err -Raw -ErrorAction SilentlyContinue) + (Get-Content ui.out -Raw -ErrorAction SilentlyContinue)
            if ($txt -match "http://127\.0\.0\.1:\d+/\?t=[0-9a-f]+") { $url = $Matches[0] }
          }
          if (-not $url) { Get-Content ui.err, ui.out; throw "wizard did not print its address" }
          $base = $url -replace '/\?t=.*$', ''; $tok = ($url -split 't=')[1]
          $h = @{ "X-DA-Token" = $tok }
          $info = Invoke-RestMethod "$base/api/info" -Headers $h
          if ($info.preview -ne 68) { throw "info.preview = $($info.preview)" }
          $c = Invoke-RestMethod "$base/api/connect" -Method Post -Headers $h -ContentType "application/json" -Body '{"mode":"demo"}'
          if (-not $c.ok) { throw "connect: $($c | ConvertTo-Json)" }
          $null = Invoke-RestMethod "$base/api/scan" -Method Post -Headers $h -ContentType "application/json" -Body '{"quick":false}'
          $state = ""
          for ($i = 0; $i -lt 100 -and $state -ne "done"; $i++) { Start-Sleep -Milliseconds 200; $state = (Invoke-RestMethod "$base/api/status" -Headers $h).state; if ($state -eq "error") { throw "scan error" } }
          if ($state -ne "done") { throw "scan did not finish" }
          $res = Invoke-RestMethod "$base/api/result" -Headers $h
          if ($res.preview_checks -ne 68 -or $res.inventory.tier0.Count -lt 5) { throw "result: preview $($res.preview_checks), tier0 $($res.inventory.tier0.Count)" }
          $log = Invoke-WebRequest "$base/api/run.log?t=$tok" -UseBasicParsing
          if ($log.Content -notmatch "finished: exit 0") { throw "run log: $($log.Content)" }
          # the page itself renders (static assets served, CSP present)
          $page = Invoke-WebRequest "$base/?t=$tok" -UseBasicParsing
          if ($page.StatusCode -ne 200 -or -not $page.Headers["Content-Security-Policy"]) { throw "page: $($page.StatusCode)" }
          $null = Invoke-RestMethod "$base/api/quit" -Method Post -Headers $h -ContentType "application/json" -Body '{}'
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw "wizard did not quit" }
          Write-Host "wizard ok: $url"

  sbom:
    name: SBOM (CycloneDX)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cyclonedx-gomod
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod app -main cmd/dirauditor -licenses -json -output sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 14
