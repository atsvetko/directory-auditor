# Catalogue entry — clean-room spec (docs/clean-room.md). Facts in our own words,
# primary references only. A pack may be written only after `verified_by` is filled.
id: DSA-0020
title:
  en: Account lockout is disabled (lockoutThreshold = 0)
  ru: Блокировка учётных записей отключена (lockoutThreshold = 0)
domain: directory-core
tier: 0
severity: high
quick: true
status: draft
verified_by: ''
verified_on: ''
object: The domain naming-context head (objectClass domainDNS)
attributes:
- lockoutThreshold
- lockoutDuration
- lockOutObservationWindow
condition: >-
  lockoutThreshold on the domain head is 0 or absent. Evidence: lockoutDuration and lockOutObservationWindow
  (negative 100-ns intervals).
threshold: lockoutThreshold = 0
rationale: >-
  The threshold is what turns online password guessing from minutes into years. Both Windows and Samba
  provision the domain with 0 (never lock), so a domain that was never hardened accepts unlimited guesses
  against every account over LDAP, SMB and Kerberos. Fine-grained password policies can override this
  per group, but the domain value is what applies to everyone else.
remediation:
  en: >-
    Set a threshold in the Default Domain Policy (Windows: Account Lockout Policy; Samba: `samba-tool
    domain passwordsettings set --account-lockout-threshold=10 --account-lockout-duration=30 --reset-account-lockout-after=30`).
    Pair it with monitoring of lockout events so a spraying attempt is seen, and keep service accounts
    with long random passwords so they cannot be locked out maliciously.
  ru: >-
    Задайте порог в политике домена по умолчанию (Windows: политика блокировки учётных записей; Samba:
    `samba-tool domain passwordsettings set --account-lockout-threshold=10 --account-lockout-duration=30
    --reset-account-lockout-after=30`). Дополните мониторингом событий блокировки, чтобы заметить распыление
    паролей, а служебным учётным записям задайте длинные случайные пароли, чтобы их нельзя было заблокировать
    намеренно.
attack:
- id: T1110.001
  name: 'Brute Force: Password Guessing'
- id: T1110.003
  name: 'Brute Force: Password Spraying'
engine: declarative
query_sketch:
  base: default
  scope: base
  filter: (&(objectClass=domainDNS)(!(lockoutThreshold>=1)))
  attributes:
  - lockoutThreshold
  - lockoutDuration
  - lockOutObservationWindow
references:
- title: Microsoft Learn — Account lockout threshold (default 0 in the Default Domain Policy)
  url: >-
    https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-lockout-threshold
- title: >-
    Samba source — source4/setup/provision_basedn_modify.ldif (provisioned domain policy: lockoutThreshold
    0, pwdProperties 1, pwdHistoryLength 24, maxPwdAge 42 days, MAQ 10)
  url: >-
    https://github.com/samba-team/samba/blob/08d94fbc998a68259a4d2b424ff226fb5d4f9c7c/source4/setup/provision_basedn_modify.ldif
- title: >-
    Microsoft Learn — AD schema: lockoutThreshold, minPwdLength, maxPwdAge, pwdHistoryLength attributes
  url: https://learn.microsoft.com/en-us/windows/win32/adschema/a-lockoutthreshold
- title: MITRE ATT&CK — T1110.003 Password Spraying
  url: https://attack.mitre.org/techniques/T1110/003/
notes: >-
  Fine-grained password policies (msDS-PasswordSettings) are not evaluated yet; when one applies to the
  whole domain this entry over-reports.
condition_cel: intattr(obj, "lockoutThreshold") == 0
expect:
- DC=lab,DC=example
- DC=samba,DC=example
