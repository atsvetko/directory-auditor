# Catalogue entry — clean-room spec (docs/clean-room.md). Facts in our own words,
# primary references only. A pack may be written only after `verified_by` is filled.
id: DSA-0068
title:
  en: KDS root key readable outside Tier 0 (Golden gMSA exposure)
  ru: Корневой ключ KDS доступен для чтения вне нулевого уровня (риск Golden gMSA)
domain: directory-core
tier: 0
severity: high
quick: true
status: draft
verified_by: ''
verified_on: ''
object: >-
  The KDS root key objects (class msKds-ProvRootKey, under CN=Master Root Keys,CN=Group Key Distribution Service,CN=Services
  in the configuration partition) and their security descriptors
attributes:
- cn
condition: >-
  A KDS root key object has an allow ACE granting a principal that is not Tier 0 (SELF and CREATOR OWNER excluded)
  read of the key (ReadProperty on all properties or GenericRead) or control of the object (full control, WriteDacl,
  WriteOwner, GenericAll).
threshold: any occurrence
rationale: >-
  Every group managed service account password is derived from a KDS root key plus public inputs. The root key does
  not change and cannot be rotated. By default only domain controllers and domain administrators can read it. Any
  other principal that can read the root key material can compute, offline and at any time, the current and future
  passwords of every gMSA tied to that key — including privileged gMSAs — without touching a domain controller again.
remediation:
  en: >-
    Remove the ACE so only domain controllers and Tier-0 administrators can read the KDS root keys. If a non-Tier-0
    principal could read a root key, treat every gMSA under it as compromised: create a new KDS root key and migrate
    the gMSAs to new accounts, since the key itself cannot be rotated.
  ru: >-
    Удалите ACE, чтобы корневые ключи KDS могли читать только контроллеры домена и администраторы нулевого уровня.
    Если корневой ключ мог прочитать субъект вне нулевого уровня, считайте скомпрометированными все gMSA на его
    основе: создайте новый корневой ключ KDS и переведите gMSA на новые учётные записи, поскольку сам ключ ротации
    не подлежит.
attack:
- id: T1552
  name: Unsecured Credentials
- id: T1078.002
  name: 'Valid Accounts: Domain Accounts'
anssi:
- vuln_permissions_gmsa_keys
engine: declarative
query_sketch:
  base: default
  scope: subtree
  filter: (objectClass=msKds-ProvRootKey)
references:
- title: >-
    Microsoft Learn — Create the KDS root key (Master Root Keys container in the configuration partition)
  url: >-
    https://learn.microsoft.com/en-us/windows-server/security/group-managed-service-accounts/create-the-key-distribution-services-kds-root-key
- title: Microsoft Learn — ms-Kds-RootKeyData attribute
  url: https://learn.microsoft.com/en-us/windows/win32/adschema/a-mskds-rootkeydata
notes: >-
  The root key value (msKds-RootKeyData) is readable only with read and extended rights that only domain admins
  hold by default; a normal auditing account usually cannot read the SD, in which case the check reports not-collected.
  Read in the configuration partition, so it applies forest-wide.
evidence_principals: >-
  aces(obj).filter(a, a.allow && a.effective && !a.trustee_tier0 && !(a.trustee in ["S-1-5-10", "S-1-3-0"]) && (mask_has(a.mask,
  0x10000000) || mask_has(a.mask, 0xF01FF) || mask_has(a.mask, 0x40000) || mask_has(a.mask, 0x80000) || mask_has(a.mask,
  0x80000000) || (mask_has(a.mask, 0x10) && a.object_type == ""))).map(a, a.trustee)
condition_cel: >-
  sd_readable(obj) && aces(obj).exists(a, a.allow && a.effective && !a.trustee_tier0 && !(a.trustee in ["S-1-5-10",
  "S-1-3-0"]) && (mask_has(a.mask, 0x10000000) || mask_has(a.mask, 0xF01FF) || mask_has(a.mask, 0x40000) || mask_has(a.mask,
  0x80000) || mask_has(a.mask, 0x80000000) || (mask_has(a.mask, 0x10) && a.object_type == "")))
expect:
- >-
  CN=81b4f12e-9000-0000-0000-000000000001,CN=Master Root Keys,CN=Group Key Distribution Service,CN=Services,CN=Configuration,DC=lab,DC=example
