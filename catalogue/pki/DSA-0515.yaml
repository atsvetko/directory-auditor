# Catalogue entry — clean-room spec (docs/clean-room.md). Facts in our own words,
# primary references only. A pack may be written only after `verified_by` is filled.
id: DSA-0515
title:
  en: Schema v1 template lets the requester inject application policies (EKUwu, ESC15)
  ru: Шаблон схемы v1 позволяет заявителю внедрить политики применения (EKUwu, ESC15)
domain: pki
providers: [ad]
tier: 0
severity: high
quick: false
status: draft
verified_by: ''
verified_on: ''
object: >-
  Published pKICertificateTemplate objects with msPKI-Template-Schema-Version of 1, as for DSA-0501
attributes:
- msPKI-Template-Schema-Version
- msPKI-Certificate-Name-Flag
- pKIExtendedKeyUsage
- msPKI-Enrollment-Flag
- msPKI-RA-Signature
- nTSecurityDescriptor
condition: >-
  A published schema-version-1 template lets the requester supply the subject
  (CT_FLAG_ENROLLEE_SUPPLIES_SUBJECT 0x1 in msPKI-Certificate-Name-Flag), manager approval and an issuance
  signature are not required, and an Enroll right is granted outside Tier 0 — the pattern CVE-2024-49019
  abuses on a CA that is not patched, letting the requester add arbitrary application policies (including
  client authentication) to the certificate.
threshold: any occurrence
rationale: >-
  On schema-version-1 templates an unpatched CA copies application policies from the request into the issued
  certificate. A requester who may enrol can inject a client-authentication application policy into a
  certificate from a template that was never meant for authentication, and, with a requester-supplied subject,
  authenticate as another account. The November 2024 update (CVE-2024-49019) stops the CA from honouring
  request-supplied application policies.
remediation:
  en: >-
    Patch every CA for CVE-2024-49019. Restrict enrolment on schema-version-1 templates that allow a requester-
    supplied subject to the accounts that need it, turn off 'supply in the request', and prefer schema version 2
    or later.
  ru: >-
    Установите на всех центрах сертификации обновление для CVE-2024-49019. Ограничьте права записи на шаблоны
    схемы версии 1 с режимом «субъект задаётся в заявке» нужными учётными записями, отключите этот режим и
    используйте шаблоны схемы версии 2 и выше.
attack:
- id: T1649
  name: Steal or Forge Authentication Certificates
engine: declarative
references:
- title: >-
    Microsoft Learn — AD CS security posture assessments (ESC15: arbitrary application policies, CVE-2024-49019)
  url: https://learn.microsoft.com/en-us/defender-for-identity/security-posture-assessments/certificates
- title: >-
    TrustedSec — EKUwu: not just another AD CS ESC (CVE-2024-49019)
  url: https://trustedsec.com/blog/ekuwu-not-just-another-ad-cs-esc
notes: >-
  Schema version is msPKI-Template-Schema-Version; value 1 is the vulnerable class. The CA fix is the November
  2024 update for CVE-2024-49019; a patched CA ignores request-supplied application policies, so the residual
  exposure is the template configuration plus unpatched CAs. CA patch level is a tier-2 signal; confirm how to
  read it at verification.
query_sketch:
  base: CN=Certificate Templates,CN=Public Key Services,CN=Services,CN=Configuration,<forest root>
  scope: one
  filter: (objectClass=pKICertificateTemplate)
condition_cel: >-
  obj.class.exists(c, c.lowerAscii() == "pkicertificatetemplate") && sd_readable(obj) && published_template(obj) && intattr(obj, "msPKI-Template-Schema-Version") == 1 && anyflag(obj, "msPKI-Certificate-Name-Flag", 0x1) && !flags(obj, "msPKI-Enrollment-Flag", 0x2) && intattr(obj, "msPKI-RA-Signature") == 0 && aces(obj).exists(a, a.allow && a.effective && !a.trustee_tier0 && !(a.trustee in ["S-1-5-10", "S-1-3-0"]) && (mask_has(a.mask, 0x10000000) || (mask_has(a.mask, 0x100) && (a.object_type == "" || a.object_type == "0e10c968-78fb-11d2-90d4-00c04f79dc55" || a.object_type == "a05b8cc2-17bc-4802-a710-e7c15ab866a2"))))
expect:
- CN=VulnSchemaV1,CN=Certificate Templates,CN=Public Key Services,CN=Services,CN=Configuration,DC=lab,DC=example
