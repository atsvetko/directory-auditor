# Catalogue entry — clean-room spec (docs/clean-room.md). Facts in our own words,
# primary references only. A pack may be written only after `verified_by` is filled.
id: DSA-0501
title:
  en: Certificate template lets a requester name any subject and authenticate as it (ESC1)
  ru: Шаблон сертификата позволяет заявителю задать произвольного субъекта и войти от его имени (ESC1)
domain: pki
providers: [ad]
tier: 0
severity: critical
quick: false
status: draft
verified_by: ''
verified_on: ''
object: >-
  pKICertificateTemplate objects in CN=Certificate Templates,CN=Public Key
  Services,CN=Services,CN=Configuration of the forest, that are published on at least one enterprise CA (named
  in a pKIEnrollmentService certificateTemplates attribute)
attributes:
- msPKI-Certificate-Name-Flag
- pKIExtendedKeyUsage
- msPKI-Certificate-Application-Policy
- msPKI-Enrollment-Flag
- msPKI-RA-Signature
- nTSecurityDescriptor
condition: >-
  A published template lets the requester supply the subject alternative name (msPKI-Certificate-Name-Flag has
  CT_FLAG_ENROLLEE_SUPPLIES_SUBJECT 0x1 or CT_FLAG_ENROLLEE_SUPPLIES_SUBJECT_ALT_NAME 0x10000), AND an
  extended key usage that permits client authentication is present (Client Authentication 1.3.6.1.5.5.7.3.2,
  Smart Card Logon 1.3.6.1.4.1.311.20.2.2, PKINIT Client Authentication 1.3.6.1.5.2.3.4, or Any Purpose
  2.5.29.37.0, or the EKU list is empty), AND manager approval is off (msPKI-Enrollment-Flag has no
  CT_FLAG_PEND_ALL_REQUESTS 0x2), AND no issuance signature is required (msPKI-RA-Signature is 0), AND an
  Enroll or Autoenroll right is granted on the template to a principal outside Tier 0.
threshold: any occurrence
rationale: >-
  When a template lets the requester fill in the subject alternative name and the issued certificate is valid
  for client authentication, whoever may enrol can request a certificate in any account's name — including a
  domain administrator — and then authenticate as that account. Manager approval and an enrolment signature
  are the controls that would stop this; with both off the escalation needs only enrolment rights.
remediation:
  en: >-
    Turn off 'supply in the request' for the subject name, remove the authentication EKUs that the template does
    not need, restrict enrolment to the accounts that must have it, or require manager approval. Unpublish the
    template from every CA if it is not in use.
  ru: >-
    Отключите режим «субъект задаётся в заявке», удалите области применения ключа для аутентификации, если они
    шаблону не нужны, ограничьте права записи только теми учётными записями, которым они необходимы, либо
    включите утверждение заявок администратором. Если шаблон не используется, снимите его публикацию со всех
    центров сертификации.
attack:
- id: T1649
  name: Steal or Forge Authentication Certificates
- id: T1078.002
  name: 'Valid Accounts: Domain Accounts'
anssi:
- vuln_adcs_template_auth_enroll_with_name
engine: declarative
query_sketch:
  base: CN=Certificate Templates,CN=Public Key Services,CN=Services,CN=Configuration,<forest root>
  scope: one
  filter: (objectClass=pKICertificateTemplate)
references:
- title: >-
    Microsoft Learn — [MS-CRTD] 2.28 msPKI-Certificate-Name-Flag attribute
  url: https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-crtd/1192823c-d839-4bc3-9b6b-fa8c53507ae1
- title: >-
    SpecterOps Certify documentation — ESC1 misconfigured client authentication templates
  url: https://docs.specterops.io/ghostpack-docs/Certify.wik-mdx/esc1-misconfigured-client-authentication
- title: >-
    Microsoft Learn — AD CS security posture assessments (ESC1)
  url: https://learn.microsoft.com/en-us/defender-for-identity/security-posture-assessments/certificates
notes: >-
  New block DSA-0501…0599 for the pki domain; it follows the reserved Group Policy block (DSA-0401…0499).
  Collector: the Public Key Services containers in the configuration partition are not read today (ANSSI plan
  wave 4). Enrolment rights are the Enroll (extended right 0e10c968-78fb-11d2-90d4-00c04f79dc55) and
  Autoenroll (a05b8cc2-17bc-4802-a710-e7c15ab866a2) ACEs; Tier 0 is the TIER0.md set. 'Published' means the
  template name appears in some enterprise CA's certificateTemplates. At verification confirm the EKU OID list
  and whether an empty pKIExtendedKeyUsage should count as client-auth-capable.
