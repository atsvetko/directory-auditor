# Catalogue entry — clean-room spec (docs/clean-room.md). Facts in our own words,
# primary references only. A pack may be written only after `verified_by` is filled.
id: DSA-0507
title:
  en: CA grants Manage CA or Manage Certificates outside Tier 0 (ESC7)
  ru: Центр сертификации предоставляет права «управление ЦС» или «управление сертификатами» вне нулевого уровня (ESC7)
domain: pki
providers: [ad]
tier: 2
severity: high
quick: false
status: draft
verified_by: ''
verified_on: ''
object: >-
  The CA security descriptor of each enterprise CA (read from the CA host), with the pKIEnrollmentService
  object for the CA's name
attributes:
- Security
condition: >-
  A principal outside Tier 0 holds the CA role ManageCA (CA administrator) or ManageCertificates (certificate
  manager) in the CA's security descriptor.
threshold: any occurrence
rationale: >-
  A certificate manager can approve a pending request, which defeats manager approval. A CA administrator can
  change CA settings — for example set EDITF_ATTRIBUTESUBJECTALTNAME2 (ESC6) or disable the SID extension
  (ESC16) — and so reach forest-wide impersonation. Either role in the wrong hands turns into an issuance-time
  escalation.
remediation:
  en: >-
    Remove ManageCA and ManageCertificates from every principal outside Tier 0. Grant these roles only to
    accounts dedicated to CA administration and monitor changes to the CA security descriptor.
  ru: >-
    Удалите права «управление ЦС» и «управление сертификатами» у всех учётных записей вне нулевого уровня.
    Предоставляйте эти роли только учётным записям, выделенным для администрирования центра сертификации, и
    контролируйте изменения его дескриптора безопасности.
attack:
- id: T1649
  name: Steal or Forge Authentication Certificates
- id: T1222
  name: File and Directory Permissions Modification
engine: declarative
references:
- title: >-
    Microsoft Learn — AD CS security posture assessments (ESC7: CA access control)
  url: https://learn.microsoft.com/en-us/defender-for-identity/security-posture-assessments/certificates
- title: >-
    SpecterOps Certify documentation — ESC7 vulnerable certificate authority access control
  url: https://docs.specterops.io/ghostpack-docs/Certify.wik-mdx/esc7-vulnerable-certificate-authority-access-control
notes: >-
  Tier 2: the CA security descriptor is in the CA registry (CertSvc Configuration\<CA>\Security), read via
  ICertAdminD2 GetCASecurity or remote registry with CA access — not LDAP. ManageCA and ManageCertificates are
  the two CA roles; confirm their bit values and the read path at verification.
