# Catalogue entry — clean-room spec (docs/clean-room.md). Facts in our own words,
# primary references only. A pack may be written only after `verified_by` is filled.
id: DSA-0516
title:
  en: CA omits the SID security extension from every certificate (ESC16)
  ru: Центр сертификации не добавляет расширение безопасности с SID ни в один сертификат (ESC16)
domain: pki
providers: [ad]
tier: 2
severity: critical
quick: false
status: draft
verified_by: ''
verified_on: ''
object: >-
  The policy-module configuration of each enterprise CA (the disabled-extensions list read from the CA host)
attributes:
- DisableExtensionList
condition: >-
  A CA's disabled-extensions list (the policy module's DisableExtensionList) contains the SID security
  extension OID 1.3.6.1.4.1.311.25.2, so the CA leaves that extension out of every certificate it issues, not
  just those from a particular template.
threshold: any occurrence
rationale: >-
  Disabling the SID security extension at the CA is the CA-wide version of the template flag in ESC9: no
  certificate the CA issues carries the strong SID binding, so a domain controller that is not in full
  enforcement falls back to name-based mapping for all of them. This re-opens name-based certificate abuse
  across every template on that CA.
remediation:
  en: >-
    Remove the SID security extension OID (1.3.6.1.4.1.311.25.2) from the CA's disabled-extensions list and
    restart the certificate service, then move domain controllers to full strong-mapping enforcement. Reserve
    this setting for documented, time-bounded compatibility needs only.
  ru: >-
    Удалите OID расширения безопасности с SID (1.3.6.1.4.1.311.25.2) из списка отключённых расширений центра
    сертификации и перезапустите его службу, затем переведите контроллеры домена в режим полного строгого
    сопоставления. Применяйте такую настройку только для документированных и ограниченных по времени задач
    совместимости.
attack:
- id: T1649
  name: Steal or Forge Authentication Certificates
- id: T1556
  name: Modify Authentication Process
engine: declarative
references:
- title: >-
    Microsoft Learn — [MS-CRTD] szOID_NTDS_CA_SECURITY_EXT (OID 1.3.6.1.4.1.311.25.2)
  url: https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-crtd/ec71fd43-61c2-407b-83c9-b52272dec8a1
- title: >-
    SpecterOps Certify documentation — ESC16 security extension disabled on certificate authority
  url: https://docs.specterops.io/ghostpack-docs/Certify.wik-mdx/esc16-security-extension-disabled-on-certificate-authority
notes: >-
  Tier 2: DisableExtensionList is in the CA registry (CertSvc Configuration\<CA>\PolicyModules), read over
  remote registry or ICertAdmin with CA access. First described by Will Schroeder (2022) as an ESC7/ESC6 side
  effect and later catalogued as ESC16 by Oliver Lyak. Confirm the exact value name and OID format stored in
  the list at verification.
