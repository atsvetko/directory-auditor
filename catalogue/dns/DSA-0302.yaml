# Catalogue entry — clean-room spec (docs/clean-room.md). Facts in our own words,
# primary references only. A pack may be written only after `verified_by` is filled.
id: DSA-0302
title:
  en: AD-integrated DNS zones accept nonsecure dynamic updates
  ru: Зоны DNS, интегрированные в AD, принимают небезопасные динамические обновления
domain: dns
providers: [ad, samba]
tier: 0
severity: high
quick: false
status: draft
verified_by: ''
verified_on: ''
object: dnsZone objects in the DNS application partitions and in CN=MicrosoftDNS,CN=System
attributes:
- dNSProperty
- name
condition: >-
  The zone's dNSProperty holds the allow-update property (DSPROPERTY_ZONE_ALLOW_UPDATE, property id 0x00000002)
  with the value ZONE_UPDATE_UNSECURE (1), meaning both secure and nonsecure dynamic updates are accepted.
  Reverse-lookup zones are reported at the same severity. Zones with updates off (0) or secure only (2) pass.
threshold: any zone
rationale: >-
  With nonsecure updates on, any host that can reach a DNS server can create or overwrite records in the zone
  without authenticating. An attacker on the network can register names that clients look up — a missing server,
  WPAD, a mistyped host — and capture or relay the authentication traffic sent to them.
remediation:
  en: >-
    Set dynamic updates on the zone to "Secure only". If DHCP servers register records for non-domain clients,
    configure them with dedicated credentials for DNS updates instead of allowing nonsecure updates.
  ru: >-
    Установите для зоны режим динамических обновлений «только безопасные». Если серверы DHCP регистрируют записи
    для компьютеров вне домена, задайте им отдельные учётные данные для обновления DNS вместо разрешения
    небезопасных обновлений.
attack:
- id: T1557
  name: Adversary-in-the-Middle
anssi:
- vuln_dnszone_bad_prop
engine: declarative
query_sketch:
  base: CN=MicrosoftDNS,<each DNS application partition found under CN=Partitions>; CN=MicrosoftDNS,CN=System,<default>
  scope: one
  filter: (objectClass=dnsZone)
references:
- title: Microsoft Open Specifications — MS-DNSP 2.2.6.1.1 DNS_ZONE_UPDATE
  url: https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-dnsp/d4b84209-f00c-478f-80d7-8dd0f1633d9e
- title: Microsoft Learn — DNS-Property attribute (AD schema)
  url: https://learn.microsoft.com/en-us/windows/win32/adschema/a-dnsproperty
- title: Samba bugzilla 9331 — the Samba DNS server honours the zone's allow-update property
  url: https://bugzilla.samba.org/show_bug.cgi?id=9331
- title: ANSSI / CERT-FR — Active Directory control points (vuln_dnszone_bad_prop)
  url: https://www.cert.ssi.gouv.fr/uploads/ad_checklist.html
notes: >-
  dNSProperty is a multi-valued binary attribute; each value is a structure with a property id and data, decoded
  by the engine, never by string matching. Open point: confirm the property id 0x00000002
  against the MS-DNSP section on dnsProperty. Zone transfer settings are not stored in a form LDAP can read
  reliably and are planned as a tier-1 probe (group Г), not here. Implementation notes: the spec named engine
  complex:dnsproperty; the decoding is now a CEL helper, dns_zone_property(obj, id) (internal/check/dnsprop.go,
  unit-tested), so the entry is declarative. It reads each value as [MS-DNSP] 2.3.2.1 lays it out (little-endian
  DataLength, NameLength, Flag, Version, Id, then Data and one Name byte) and returns Data as an integer for the
  matching id, or -1 when the zone carries no such property; an absent allow-update property is not a finding
  (the DNS server then treats updates as off). Property id 0x00000002 = DSPROPERTY_ZONE_ALLOW_UPDATE and the
  values 0/1/2 = ZONE_UPDATE_OFF/UNSECURE/SECURE were confirmed by the implementer from MS-DNSP; the human
  verifier should still check them against 2.3.2.1.1 and 2.2.6.1.1. Evidence shows the decoded properties ("id
  0x2 = 1"). The Samba smb.conf "allow dns updates" switch, which overrides the zone setting on a Samba DC, is
  DSA-0207. ANSSI vuln_dnszone_bad_prop is tagged and marked partial in frameworks/anssi-plan.yaml: zone-transfer
  settings are not readable over LDAP (see above).
condition_cel: obj.class.exists(c, c.lowerAscii() == "dnszone") && dns_zone_property(obj, 2) == 1
expect:
- DC=_msdcs.lab.example,CN=MicrosoftDNS,DC=ForestDnsZones,DC=lab,DC=example
- DC=0.10.in-addr.arpa,CN=MicrosoftDNS,DC=DomainDnsZones,DC=lab,DC=example
- DC=samba.example,CN=MicrosoftDNS,DC=DomainDnsZones,DC=samba,DC=example
