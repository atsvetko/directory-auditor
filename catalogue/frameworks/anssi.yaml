# ANSSI / CERT-FR — « Points de contrôle Active Directory » (Active Directory control points).
# Reference index only: identifier, levels and title of each published control point, used to map
# Directory Auditor checks to ANSSI (see ../ANSSI-COVERAGE.md and the `anssi:` field of each entry).
# Checks are written in our own words from primary sources; no ANSSI description text is reproduced.
#
# Source : CERT-FR, CERTFR-2020-DUR-001 — https://www.cert.ssi.gouv.fr/dur/CERTFR-2020-DUR-001/
#          checklist https://www.cert.ssi.gouv.fr/uploads/ad_checklist.html
# Version: 2024-04-17 (latest revision of CERTFR-2020-DUR-001); extracted 2026-10-08.
# Levels : 1 critical · 2 serious · 3 baseline · 4 good · 5 state of the art. A point listed under several
#          levels applies at each, with stricter criteria at higher levels. ANSSI publishes levels 1–3 (plus a
#          few level-4 points) at this revision.
