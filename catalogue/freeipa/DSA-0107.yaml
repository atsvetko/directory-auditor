# Catalogue entry — clean-room spec (docs/clean-room.md). Facts in our own words,
# primary references only. A pack may be written only after `verified_by` is filled.
id: DSA-0107
title:
  en: Password policy allows passwords shorter than 8 characters
  ru: Политика паролей допускает пароли короче 8 символов
domain: freeipa
tier: 0
severity: medium
quick: true
status: draft
verified_by: ''
verified_on: ''
object: >-
  Password policies (objectClass krbPwdPolicy) under cn=kerberos: the global policy and per-group policies
attributes:
- cn
- krbPwdMinLength
- krbPwdHistoryLength
- krbPwdMinDiffChars
- krbMaxPwdLife
- ipaPwdDictCheck
- ipaPwdUserCheck
condition: >-
  krbPwdMinLength is present and below 8 (FreeIPA's installation default). Group policies are evaluated
  individually: a group policy weaker than the global one is a finding on its own.
threshold: min length < 8
rationale: >-
  The minimum length is the only password rule that costs an attacker exponentially. FreeIPA ships 8 and
  a per-group policy can silently lower it for the very groups that matter (service owners, contractors).
  Short passwords fall to offline guessing of Kerberos pre-authentication material or to online guessing
  where lockout is weak (DSA-0108).
remediation:
  en: >-
    Raise krbPwdMinLength (`ipa pwpolicy-mod --minlength=12`, or per group with `ipa pwpolicy-mod GROUP
    --minlength=…`), enable dictionary and user-name checks (ipaPwdDictCheck, ipaPwdUserCheck) and keep
    a history length greater than 0.
  ru: >-
    Увеличьте krbPwdMinLength (`ipa pwpolicy-mod --minlength=12` или для группы `ipa pwpolicy-mod ГРУППА
    --minlength=…`), включите проверку по словарю и по имени пользователя (ipaPwdDictCheck, ipaPwdUserCheck)
    и задайте длину истории паролей больше 0.
attack:
- id: T1110.001
  name: 'Brute Force: Password Guessing'
- id: T1110.002
  name: 'Brute Force: Password Cracking'
engine: declarative
query_sketch:
  base: cn=kerberos,<default>
  scope: subtree
  filter: (&(objectClass=krbPwdPolicy)(krbPwdMinLength<=7))
  attributes:
  - cn
  - krbPwdMinLength
  - krbPwdHistoryLength
references:
- title: >-
    FreeIPA source — install/share/kerberos.ldif (global_policy defaults: minlength 8, history 0, maxfailure
    6)
  url: >-
    https://github.com/freeipa/freeipa/blob/13a1df391f11b6f575c0281f1290363afd4f1ec7/install/share/kerberos.ldif
- title: Red Hat — Defining IdM password policies
  url: >-
    https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/8/html/using_ansible_to_install_and_manage_identity_management/defining-idm-password-policies_using-ansible-to-install-and-manage-idm
- title: MITRE ATT&CK — T1110.001 Password Guessing
  url: https://attack.mitre.org/techniques/T1110/001/
notes: >-
  Reading policies needs the 'Password Policy Readers' privilege (System: Read Group Password Policy,
  bind rule permission); without it the engine reports the check as not collected. Least privilege: add
  the audit account to that privilege only.
condition_cel: hasattr(obj, "krbPwdMinLength") && intattr(obj, "krbPwdMinLength") < 8
expect:
- cn=global_policy,cn=IPA.EXAMPLE,cn=kerberos,dc=ipa,dc=example
